<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Karuzeli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #ededed;
            padding: 40px;
        }

        /* Kontener główny dla układu strzałki + slider */
        .slider-wrapper {
            position: relative;
            width: 100%;
        }

        .media-slider {
            display: flex;
            gap: 1vw;
            overflow-x: auto;
            scrollbar-width: none; /* Ukrycie paska w FF */
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
        }

        .media-slider::-webkit-scrollbar {
            display: none; /* Ukrycie paska w Chrome/Safari */
        }

        .media-item {
            max-height: 500px;
            width: auto;
            flex-shrink: 0;
            scroll-snap-align: start;
        }

        /* Strzałki */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #000;
            cursor: pointer;
            z-index: 10;
            padding: 10px 15px;
            font-weight: bold;
        }

        .slider-arrow.left { left: 10px; display: none; }
        .slider-arrow.right { right: 10px; }
    </style>
</head>
<body>

    <div class="slider-wrapper">
        <button class="slider-arrow left" onclick="scrollSlider(this, -1)">←</button>
        
        <div class="media-slider">
            <img class="media-item" src="images/2/hagd_1.png" alt="HAGD 1">
            <img class="media-item" src="images/2/hagd_2.jpg" alt="HAGD 2">
            <img class="media-item" src="images/2/hagd_3.jpg" alt="HAGD 3">
            <img class="media-item" src="images/2/hagd_4.png" alt="HAGD 4">
            <img class="media-item" src="images/2/hagd_5.png" alt="HAGD 5">
            <video class="media-item" loop muted playsinline><source src="images/2/hagd_6.mp4" type="video/mp4"></video>
        </div>

        <button class="slider-arrow right" onclick="scrollSlider(this, 1)">→</button>
    </div>

    <script>
        function scrollSlider(button, direction) {
            const wrapper = button.parentElement;
            const slider = wrapper.querySelector('.media-slider');
            
            // Przewijamy o widoczną szerokość okna slidera
            const scrollStep = slider.clientWidth;
            
            slider.scrollBy({
                left: direction * scrollStep,
                behavior: 'smooth'
            });
        }

        function checkScrollPosition(slider) {
            const wrapper = slider.parentElement;
            const leftArrow = wrapper.querySelector('.slider-arrow.left');
            const rightArrow = wrapper.querySelector('.slider-arrow.right');

            const maxScroll = slider.scrollWidth - slider.clientWidth;
            
            const isAtStart = slider.scrollLeft <= 5;
            const isAtEnd = slider.scrollLeft >= maxScroll - 5;

            leftArrow.style.display = isAtStart ? 'none' : 'block';
            rightArrow.style.display = isAtEnd ? 'none' : 'block';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const slider = document.querySelector(".media-slider");
            slider.addEventListener("scroll", () => checkScrollPosition(slider));
            window.addEventListener('resize', () => checkScrollPosition(slider));
            
            // Inicjalna weryfikacja strzałek
            checkScrollPosition(slider);
        });
    </script>

</body>
</html>
