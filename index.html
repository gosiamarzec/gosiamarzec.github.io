<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Prędkości Karuzeli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #ededed;
            padding: 40px;
            font-family: sans-serif;
        }

        .project-item {
            margin-bottom: 60px;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 40px;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
        }

        .media-slider {
            display: flex;
            gap: 1vw;
            overflow-x: auto;
            scrollbar-width: none;
            /* Wyłączamy CSS-owe smooth behavior – całą animacją steruje nasz JS */
        }

        .media-slider::-webkit-scrollbar {
            display: none;
        }

        .media-item {
            max-height: 450px;
            width: auto;
            flex-shrink: 0;
        }

        /* Strzałki */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #000;
            cursor: pointer;
            z-index: 10;
            padding: 10px 15px;
            font-weight: bold;
        }

        .slider-arrow.left { left: 10px; display: none; }
        .slider-arrow.right { right: 10px; }
    </style>
</head>
<body>

    <article class="project-item">
        <h2>1. Dziewczyny Maszyny Event Design</h2>
        <div class="slider-wrapper">
            <button class="slider-arrow left" onclick="scrollSlider(this, -1)">←</button>
            <div class="media-slider">
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_1.mp4" type="video/mp4"></video>
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_2.mp4" type="video/mp4"></video>
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_3.mp4" type="video/mp4"></video>
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_4.mp4" type="video/mp4"></video>
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_5.mp4" type="video/mp4"></video>
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_6.mp4" type="video/mp4"></video>
                <img class="media-item" src="images/1/powoli_7.jpg" alt="Powoli 7">
                <video class="media-item" loop muted playsinline><source src="images/1/powoli_8.mp4" type="video/mp4"></video>
            </div>
            <button class="slider-arrow right" onclick="scrollSlider(this, 1)">→</button>
        </div>
    </article>

    <article class="project-item">
        <h2>2. Supplement packaging & promotion</h2>
        <div class="slider-wrapper">
            <button class="slider-arrow left" onclick="scrollSlider(this, -1)">←</button>
            <div class="media-slider">
                <img class="media-item" src="images/2/hagd_1.png" alt="HAGD 1">
                <img class="media-item" src="images/2/hagd_2.jpg" alt="HAGD 2">
                <img class="media-item" src="images/2/hagd_3.jpg" alt="HAGD 3">
                <img class="media-item" src="images/2/hagd_4.png" alt="HAGD 4">
                <img class="media-item" src="images/2/hagd_5.png" alt="HAGD 5">
                <video class="media-item" loop muted playsinline><source src="images/2/hagd_6.mp4" type="video/mp4"></video>
            </div>
            <button class="slider-arrow right" onclick="scrollSlider(this, 1)">→</button>
        </div>
    </article>

    <script>
        // Funkcja ułatwiająca gładkie przyspieszanie i hamowanie (Ease-In-Out)
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Glówna funkcja wykonująca customową animację przewijania ze stałą prędkością
        function animateScroll(slider, targetScroll) {
            const startScroll = slider.scrollLeft;
            const distance = targetScroll - startScroll;
            
            if (Math.abs(distance) < 1) return;

            // KONTROLA PRĘDKOŚCI:
            // 1.5 ms na 1px przesunięcia (im większa liczba, tym WOLNIEJ)
            const speedFactor = 1.5; 
            
            // Minimalny i maksymalny czas (zabezpieczenie dla bardzo małych/dużych przesunięć)
            const minDuration = 300; // ms
            const maxDuration = 2000; // ms

            const duration = Math.min(Math.max(Math.abs(distance) * speedFactor, minDuration), maxDuration);
            let startTime = null;

            function step(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Przeliczamy postęp przez funkcję easing
                const easeProgress = easeInOutCubic(progress);
                
                slider.scrollLeft = startScroll + (distance * easeProgress);

                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }

        function scrollSlider(button, direction) {
            const wrapper = button.parentElement;
            const slider = wrapper.querySelector('.media-slider');
            const items = Array.from(slider.querySelectorAll('.media-item'));
            
            if (!items.length) return;

            const sliderRect = slider.getBoundingClientRect();
            const tolerance = 5;
            
            // Fizyczny maksymalny limit przewijania
            const maxScroll = slider.scrollWidth - slider.clientWidth;
            let targetScroll = slider.scrollLeft;

            if (direction === 1) {
                const nextItem = items.find(item => {
                    const itemRect = item.getBoundingClientRect();
                    return itemRect.right > sliderRect.right + tolerance;
                });

                if (nextItem) {
                    targetScroll = slider.scrollLeft + (nextItem.getBoundingClientRect().left - sliderRect.left);
                } else {
                    targetScroll = maxScroll;
                }
            } else {
                const prevItem = items.slice().reverse().find(item => {
                    const itemRect = item.getBoundingClientRect();
                    return itemRect.left < sliderRect.left - tolerance;
                });

                if (prevItem) {
                    targetScroll = slider.scrollLeft - (sliderRect.left - prevItem.getBoundingClientRect().left);
                } else {
                    targetScroll = 0;
                }
            }

            // ZABEZPIECZENIE PRZED KRAWĘDZIĄ:
            // Docinamy docelową pozycję do realnych granic skrola [0, maxScroll]
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));

            // Uruchamiamy animację ze skorygowanym dystansem
            animateScroll(slider, targetScroll);
        }

        function checkScrollPosition(slider) {
            const wrapper = slider.parentElement;
            const leftArrow = wrapper.querySelector('.slider-arrow.left');
            const rightArrow = wrapper.querySelector('.slider-arrow.right');

            if (!leftArrow || !rightArrow) return;

            const maxScroll = slider.scrollWidth - slider.clientWidth;
            
            const isAtStart = slider.scrollLeft <= 5;
            const isAtEnd = slider.scrollLeft >= maxScroll - 5;

            leftArrow.style.display = isAtStart ? 'none' : 'block';
            rightArrow.style.display = isAtEnd ? 'none' : 'block';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const sliders = document.querySelectorAll(".media-slider");

            sliders.forEach((slider) => {
                slider.addEventListener("scroll", () => checkScrollPosition(slider));
                checkScrollPosition(slider);
            });

            window.addEventListener('resize', () => {
                sliders.forEach((slider) => checkScrollPosition(slider));
            });

            const videos = document.querySelectorAll("video.media-item");
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.5 });

            videos.forEach(video => observer.observe(video));
        });
    </script>

</body>
</html>
