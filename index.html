.media-item {

    <script>
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateScroll(slider, targetScroll) {
            const startScroll = slider.scrollLeft;
            const distance = targetScroll - startScroll;
            
            if (Math.abs(distance) < 1) return;

            const speedFactor = 2.0; 
            const minDuration = 1200; 
            const maxDuration = 3000; 

            const duration = Math.min(Math.max(Math.abs(distance) * speedFactor, minDuration), maxDuration);
            let startTime = null;

            function step(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeProgress = easeInOutCubic(progress);
                slider.scrollLeft = startScroll + (distance * easeProgress);

                if (progress < 1) {
                    requestAnimationFrame(step);
                }
            }

            requestAnimationFrame(step);
        }

function scrollSlider(button, direction) {
    const wrapper = button.parentElement;
    const slider = wrapper.querySelector('.media-slider');
    const items = Array.from(slider.querySelectorAll('.media-item'));
    
    if (!items.length) return;

    const sliderRect = slider.getBoundingClientRect();
    const maxScroll = slider.scrollWidth - slider.clientWidth;
    
    const isMobile = window.innerWidth <= 768;
    const tolerance = isMobile ? 1 : 5;

    let targetScroll = slider.scrollLeft;

    if (direction === 1) {
        // Szukamy pierwszego elementu, który wystaje po prawej stronie
        let nextItem = items.find(item => {
            const itemRect = item.getBoundingClientRect();
            return itemRect.right > sliderRect.right + tolerance;
        });

        if (nextItem) {
            const nextItemRect = nextItem.getBoundingClientRect();
            const nextItemWidth = nextItemRect.width;
            
            // Domyślny docelowy punkt przewinięcia
            let calculatedTarget = slider.scrollLeft + (nextItemRect.left - sliderRect.left);

            // SPRAWDZENIE: Jeśli do końca slidera zostało mniej niż 50% szerokości wjeżdżającego obrazka,
            // to przesuwamy od razu do samego końca (maxScroll)
            if (maxScroll - calculatedTarget < nextItemWidth * 0.5) {
                targetScroll = maxScroll;
            } else {
                targetScroll = calculatedTarget;
            }
        } else {
            targetScroll = maxScroll;
        }
    } else {
        // Szukamy pierwszego elementu, który wystaje po lewej stronie
        let prevItem = items.slice().reverse().find(item => {
            const itemRect = item.getBoundingClientRect();
            return itemRect.left < sliderRect.left - tolerance;
        });

        if (prevItem) {
            const prevItemRect = prevItem.getBoundingClientRect();
            const prevItemWidth = prevItemRect.width;

            // Domyślny docelowy punkt przewinięcia w lewo
            let calculatedTarget = slider.scrollLeft - (sliderRect.left - prevItemRect.left);

            // SPRAWDZENIE: Jeśli do początku slidera zostało mniej niż 50% szerokości obrazka,
            // to dociągamy od razu do zera (0)
            if (calculatedTarget < prevItemWidth * 0.5) {
                targetScroll = 0;
            } else {
                targetScroll = calculatedTarget;
            }
        } else {
            targetScroll = 0;
        }
    }

    // Fallback zabezpieczający przed brakiem reakcji na małych ekranach
    if (Math.abs(targetScroll - slider.scrollLeft) < 10) {
        targetScroll = slider.scrollLeft + (direction * (sliderRect.width * 0.8));
    }

    targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
    animateScroll(slider, targetScroll);
}

        function checkScrollPosition(slider) {
            const wrapper = slider.parentElement;
            const leftArrow = wrapper.querySelector('.slider-arrow.left');
            const rightArrow = wrapper.querySelector('.slider-arrow.right');

            if (!leftArrow || !rightArrow) return;

            const maxScroll = slider.scrollWidth - slider.clientWidth;
            
            if (maxScroll <= 0) {
                leftArrow.style.display = 'none';
                rightArrow.style.display = 'none';
                return;
            }

            const isAtStart = slider.scrollLeft <= 5;
            const isAtEnd = slider.scrollLeft >= maxScroll - 5;

            leftArrow.style.display = isAtStart ? 'none' : 'block';
            rightArrow.style.display = isAtEnd ? 'none' : 'block';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const sliders = document.querySelectorAll(".media-slider");

            sliders.forEach((slider) => {
                slider.addEventListener("scroll", () => checkScrollPosition(slider));
                checkScrollPosition(slider);
            });

            window.addEventListener('load', () => {
                sliders.forEach((slider) => checkScrollPosition(slider));
            });

            const sliderObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        checkScrollPosition(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            sliders.forEach(slider => sliderObserver.observe(slider));

            window.addEventListener('resize', () => {
                sliders.forEach((slider) => checkScrollPosition(slider));
            });

            const videos = document.querySelectorAll("video.media-item");
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.play().catch(() => {});
                    } else {
                        entry.target.pause();
                    }
                });
            }, { threshold: 0.5 });

            videos.forEach(video => videoObserver.observe(video));
        });
    </script>
